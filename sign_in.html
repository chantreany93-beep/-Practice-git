<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Brew & Bean</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../css/output.css" />
  </head>
  <body class="min-h-screen bg-gray-100 flex items-center justify-center">
    <!-- Sign In Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="text-4xl mb-2">☕</div>
        <h1 class="text-3xl font-bold text-gray-800">Brew & Bean</h1>
        <p class="text-gray-500 mt-2">Sign in to your account</p>
      </div>
      <!-- Sign In Form -->
      <form>
        <!-- Email -->
        <div class="mb-5">
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            Email
          </label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400"
          />
        </div>
        <!-- Password -->
        <div class="mb-5">
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            Password
          </label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400"
          />
        </div>
        <!-- Remember + Forgot -->
        <div class="flex items-center justify-between mb-6">
          <label class="flex items-center gap-2 text-sm text-gray-600">
            <input type="checkbox" class="rounded" /> Remember me
          </label>
          <a href="#" class="text-sm text-teal-600 hover:text-teal-700">
            Forgot password?
          </a>
        </div>
        <!-- Sign In Button -->
        <button
          type="submit"
          class="w-full bg-teal-500 text-white py-3 rounded-lg font-semibold hover:bg-teal-600 transition"
        >
          Sign In
        </button>
      </form>
      <!-- Sign Up -->
      <p class="text-center text-sm text-gray-600 mt-6">
        Don't have an account?
        <a
          href="signup.html"
          class="text-teal-600 font-semibold hover:text-teal-700"
        >
          Sign Up
        </a>
      </p>
      <!-- Back to Home -->
      <div class="text-center mt-4">
        <a
          href="../Home/Home.html"
          class="text-sm text-gray-500 hover:text-gray-700"
        >
          ← Back to Home
        </a>
      </div>
    </div>
  </body>
</html>
